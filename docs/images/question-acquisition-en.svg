<svg width="680" height="560"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f4c75"/><stop offset="1" stop-color="#3282b8"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3282b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="560" fill="#f7fafc"/>
  <rect x="0" y="0" width="680" height="60" fill="url(#hdr)"/>
  <text x="34" y="28" fill="#ffffff" font-size="20" font-weight="700">Module A · Question Acquisition &amp; Organization</text>
  <text x="34" y="48" fill="#cfe8fb" font-size="12.5">Turn any-source questions into traceable, analyzable records</text>

  <!-- Step 1 -->
  <rect x="34" y="90" width="180" height="70" rx="10" fill="#e8f4fb" stroke="#3282b8" stroke-width="1.5"/>
  <text x="50" y="118" fill="#0f4c75" font-size="14" font-weight="700">1 · Collect</text>
  <text x="50" y="138" fill="#2c3e50" font-size="11.5">real · recall · institution</text>
  <text x="50" y="153" fill="#2c3e50" font-size="11.5">· AI generated</text>

  <!-- Step 2 -->
  <rect x="250" y="90" width="180" height="70" rx="10" fill="#e8f4fb" stroke="#3282b8" stroke-width="1.5"/>
  <text x="266" y="118" fill="#0f4c75" font-size="14" font-weight="700">2 · Clean</text>
  <text x="266" y="138" fill="#2c3e50" font-size="11.5">dedupe · complete stem</text>
  <text x="266" y="153" fill="#2c3e50" font-size="11.5">unify terms (PMPH)</text>

  <!-- Step 3 -->
  <rect x="466" y="90" width="180" height="70" rx="10" fill="#e8f4fb" stroke="#3282b8" stroke-width="1.5"/>
  <text x="482" y="118" fill="#0f4c75" font-size="14" font-weight="700">3 · Tag</text>
  <text x="482" y="138" fill="#2c3e50" font-size="11.5">fill metadata schema</text>
  <text x="482" y="153" fill="#2c3e50" font-size="11.5">year·type·system·point</text>

  <g stroke="#3282b8" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M214 125 L246 125"/>
    <path d="M430 125 L462 125"/>
  </g>

  <!-- Metadata box -->
  <rect x="34" y="190" width="612" height="150" rx="12" fill="#ffffff" stroke="#3282b8" stroke-width="1.3"/>
  <text x="50" y="216" fill="#0f4c75" font-size="14" font-weight="700">Standard Metadata Schema (every question)</text>
  <g font-size="11.5" fill="#2c3e50">
    <text x="50" y="240">id · year · exam_type (执业/助理) · stage (技能/综合)</text>
    <text x="50" y="260">unit (1-4) · q_type (A1/A2/A3/A4/B1) · system · disease</text>
    <text x="50" y="280">exam_point (→ syllabus clause) · cognitive (记忆/理解/应用)</text>
    <text x="50" y="300">difficulty (易/中/难) · trap · source · confidence · tags</text>
  </g>
  <text x="50" y="328" fill="#e67e22" font-size="11.5" font-weight="600">AI questions MUST be labeled "模拟题 · 非真题" · RECALL low-confidence = trend-only</text>

  <!-- Source types -->
  <text x="34" y="378" fill="#0f4c75" font-size="14" font-weight="700">Source Typology</text>
  <g font-size="11.5">
    <rect x="34" y="392" width="118" height="40" rx="8" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="44" y="412" fill="#196f3d" font-weight="600">REAL</text>
    <text x="44" y="426" fill="#2c3e50">official (rare)</text>
    <rect x="162" y="392" width="118" height="40" rx="8" fill="#fef6e7" stroke="#e67e22"/>
    <text x="172" y="412" fill="#a8590c" font-weight="600">RECALL</text>
    <text x="172" y="426" fill="#2c3e50">candidate memory</text>
    <rect x="290" y="392" width="118" height="40" rx="8" fill="#e8f4fb" stroke="#3282b8"/>
    <text x="300" y="412" fill="#0f4c75" font-weight="600">INST</text>
    <text x="300" y="426" fill="#2c3e50">training bank</text>
    <rect x="418" y="392" width="118" height="40" rx="8" fill="#f3eafc" stroke="#8e44ad"/>
    <text x="428" y="412" fill="#6c3483" font-weight="600">AI</text>
    <text x="428" y="426" fill="#2c3e50">simulated</text>
    <rect x="546" y="392" width="100" height="40" rx="8" fill="#f0f0f0" stroke="#7f8c8d"/>
    <text x="556" y="412" fill="#2c3e50" font-weight="600">FAC</text>
    <text x="556" y="426" fill="#2c3e50">faculty bank</text>
  </g>

  <!-- Archive -->
  <rect x="34" y="458" width="612" height="70" rx="12" fill="#0f4c75"/>
  <text x="50" y="486" fill="#ffffff" font-size="14" font-weight="700">4 · Archive → three-level: system → disease → exam_point</text>
  <text x="50" y="508" fill="#cfe8fb" font-size="12">Enables downstream aggregation: Module B (analysis) and Module C (trend summary)</text>
</svg>
