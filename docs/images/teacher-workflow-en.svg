<svg width="680" height="600"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f4c75"/><stop offset="1" stop-color="#3282b8"/>
    </linearGradient>
    <marker id="arr6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f4c75"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="600" fill="#f7fafc"/>
  <rect x="0" y="0" width="680" height="60" fill="url(#hdr)"/>
  <text x="34" y="28" fill="#ffffff" font-size="20" font-weight="700">Teacher Workflow — Closed Loop</text>
  <text x="34" y="48" fill="#cfe8fb" font-size="12.5">From teacher input to classroom, with continuous feedback</text>

  <!-- A -->
  <rect x="34" y="90" width="290" height="78" rx="12" fill="#e8f4fb" stroke="#3282b8" stroke-width="2"/>
  <text x="50" y="118" fill="#0f4c75" font-size="15" font-weight="700">A · Acquire &amp; Organize</text>
  <text x="50" y="140" fill="#2c3e50" font-size="11.5">collect + tag + archive questions</text>

  <!-- B -->
  <rect x="356" y="90" width="290" height="78" rx="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="372" y="118" fill="#196f3d" font-size="15" font-weight="700">B · Analyze Precisely</text>
  <text x="372" y="140" fill="#2c3e50" font-size="11.5">point / cognitive / difficulty / trap</text>

  <!-- C -->
  <rect x="34" y="210" width="290" height="78" rx="12" fill="#fef6e7" stroke="#e67e22" stroke-width="2"/>
  <text x="50" y="238" fill="#a8590c" font-size="15" font-weight="700">C · Summarize Trends</text>
  <text x="50" y="260" fill="#2c3e50" font-size="11.5">exam report + annual review</text>

  <!-- D -->
  <rect x="356" y="210" width="290" height="78" rx="12" fill="#f3eafc" stroke="#8e44ad" stroke-width="2"/>
  <text x="372" y="238" fill="#6c3483" font-size="15" font-weight="700">D · Teach &amp; Explain</text>
  <text x="372" y="260" fill="#2c3e50" font-size="11.5">plan / slides / script / Q&amp;A</text>

  <!-- arrows A->B->C->D -->
  <g stroke="#0f4c75" stroke-width="2.5" fill="none" marker-end="url(#arr6)">
    <path d="M324 129 L352 129"/>
    <path d="M401 168 L401 206"/>
    <path d="M356 249 L328 249"/>
  </g>

  <!-- feedback loop -->
  <path d="M34 249 C0 360 120 470 200 470 L340 470" stroke="#0f4c75" stroke-width="2.5" fill="none" stroke-dasharray="7 4" marker-end="url(#arr6)"/>
  <text x="40" y="455" fill="#0f4c75" font-size="11" font-style="italic">student outcomes feedback</text>

  <!-- outputs to classroom -->
  <rect x="34" y="320" width="612" height="70" rx="12" fill="#ffffff" stroke="#0f4c75" stroke-width="1.3"/>
  <text x="50" y="346" fill="#0f4c75" font-size="13" font-weight="700">Classroom Application</text>
  <g font-size="11.5" fill="#2c3e50">
    <text x="50" y="368">collective lesson planning · 磨课 · targeted 教案 · post-class drill · misconception Q&amp;A</text>
    <text x="50" y="384">"考点—知识点—考题" three-in-one · first organize points, then explain questions</text>
  </g>

  <!-- AI generation side -->
  <rect x="34" y="410" width="612" height="80" rx="12" fill="#eaf2f8" stroke="#1a5276" stroke-width="1.5"/>
  <text x="50" y="436" fill="#154360" font-size="13" font-weight="700">AI Characteristic Question Generation (feeds A)</text>
  <g font-size="11.5" fill="#2c3e50">
    <text x="50" y="458">trend-driven simulation: guideline-update / cross-system / clinical-scenario / case-string / cognitive-trap</text>
    <text x="50" y="478">all labeled 【模拟题 · 非真题】 · validated by Module B before archive</text>
  </g>

  <!-- authority footer -->
  <rect x="34" y="510" width="612" height="64" rx="12" fill="#0f4c75"/>
  <text x="50" y="536" fill="#ffffff" font-size="12.5" font-weight="700">Authoritative grounding (every output traceable)</text>
  <text x="50" y="558" fill="#cfe8fb" font-size="11">NHC syllabus · PMPH guidebooks · NMEC research · clinical guidelines · real-question trend analysis</text>
</svg>
