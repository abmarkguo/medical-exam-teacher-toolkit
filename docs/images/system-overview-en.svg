<svg width="680" height="540"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f4c75"/>
      <stop offset="1" stop-color="#3282b8"/>
    </linearGradient>
    <linearGradient id="aG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4fb"/><stop offset="1" stop-color="#d4eaf7"/>
    </linearGradient>
    <linearGradient id="bG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f7ef"/><stop offset="1" stop-color="#d2f0df"/>
    </linearGradient>
    <linearGradient id="cG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef6e7"/><stop offset="1" stop-color="#fbe9c8"/>
    </linearGradient>
    <linearGradient id="dG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3eafc"/><stop offset="1" stop-color="#e6d4f7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="680" height="540" fill="#f7fafc"/>
  <rect x="0" y="0" width="680" height="64" fill="url(#hdr)"/>
  <text x="34" y="30" fill="#ffffff" font-size="22" font-weight="700">Medical Exam Teacher Toolkit</text>
  <text x="34" y="50" fill="#cfe8fb" font-size="13">System Overview — Four Modules in a Closed Loop</text>

  <text x="34" y="96" fill="#0f4c75" font-size="14" font-weight="600">Target users: medical school faculty / teaching-research offices</text>

  <!-- Module A -->
  <rect x="34" y="120" width="300" height="92" rx="12" fill="url(#aG)" stroke="#3282b8" stroke-width="1.5"/>
  <text x="54" y="150" fill="#0f4c75" font-size="16" font-weight="700">A · Acquisition &amp; Organization</text>
  <text x="54" y="174" fill="#2c3e50" font-size="12.5">Collect real / recall / institution / AI</text>
  <text x="54" y="192" fill="#2c3e50" font-size="12.5">questions with traceable metadata.</text>

  <!-- Module B -->
  <rect x="346" y="120" width="300" height="92" rx="12" fill="url(#bG)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="366" y="150" fill="#196f3d" font-size="16" font-weight="700">B · Precise Analysis</text>
  <text x="366" y="174" fill="#2c3e50" font-size="12.5">Map exam point, cognitive level,</text>
  <text x="366" y="192" fill="#2c3e50" font-size="12.5">difficulty, traps per question.</text>

  <!-- Module C -->
  <rect x="34" y="232" width="300" height="92" rx="12" fill="url(#cG)" stroke="#e67e22" stroke-width="1.5"/>
  <text x="54" y="262" fill="#a8590c" font-size="16" font-weight="700">C · Trend Summary</text>
  <text x="54" y="286" fill="#2c3e50" font-size="12.5">Aggregate score distribution,</text>
  <text x="54" y="304" fill="#2c3e50" font-size="12.5">proposition patterns, annual review.</text>

  <!-- Module D -->
  <rect x="346" y="232" width="300" height="92" rx="12" fill="url(#dG)" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="366" y="262" fill="#6c3483" font-size="16" font-weight="700">D · Teaching Aids</text>
  <text x="366" y="286" fill="#2c3e50" font-size="12.5">Lesson plan, slides, script,</text>
  <text x="366" y="304" fill="#2c3e50" font-size="12.5">misconception Q&amp;A for students.</text>

  <!-- Loop arrows -->
  <g stroke="#0f4c75" stroke-width="2.5" fill="none">
    <path d="M184 212 L184 232"/>
    <path d="M496 212 L496 232"/>
    <path d="M346 176 L346 176"/>
  </g>
  <path d="M334 268 C300 360 380 430 340 460" stroke="#0f4c75" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
  <polygon points="340,460 332,448 348,450" fill="#0f4c75"/>

  <text x="350" y="420" fill="#0f4c75" font-size="12" font-style="italic">feedback: student outcomes refine the bank</text>

  <!-- Authority bar -->
  <rect x="34" y="470" width="612" height="46" rx="10" fill="#ffffff" stroke="#3282b8" stroke-width="1.2"/>
  <text x="50" y="492" fill="#0f4c75" font-size="12.5" font-weight="700">Authoritative grounding (every output traceable):</text>
  <text x="50" y="508" fill="#2c3e50" font-size="11.5">NHC official syllabus · PMPH guidebooks · NMEC research · clinical guidelines · real-question trend analysis</text>
</svg>
