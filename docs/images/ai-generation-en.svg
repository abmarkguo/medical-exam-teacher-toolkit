<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#154360"/><stop offset="1" stop-color="#1a5276"/>
    </linearGradient>
    <marker id="arr5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a5276"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="560" fill="#f7fafc"/>
  <rect x="0" y="0" width="680" height="60" fill="url(#hdr)"/>
  <text x="34" y="28" fill="#ffffff" font-size="20" font-weight="700">Trend-Driven AI Question Generation</text>
  <text x="34" y="48" fill="#aed6f1" font-size="12.5">Produce the "latest &amp; most distinctive" simulation questions · clearly labeled 模拟</text>

  <!-- inputs -->
  <rect x="34" y="86" width="612" height="70" rx="12" fill="#ffffff" stroke="#1a5276" stroke-width="1.3"/>
  <text x="50" y="110" fill="#154360" font-size="13" font-weight="700">Required Inputs</text>
  <g font-size="11.5" fill="#2c3e50">
    <text x="50" y="132">target system / disease / exam_point (→ syllabus clause) · question type · cognitive level &amp; ratio</text>
    <text x="50" y="148">difficulty · distinctive requirement (guideline update / cross-system / clinical scenario) · source tag = AI-模拟</text>
  </g>

  <!-- flow -->
  <g font-size="12">
    <rect x="34" y="180" width="180" height="60" rx="10" fill="#e8f4fb" stroke="#1a5276" stroke-width="1.5"/>
    <text x="50" y="206" fill="#154360" font-weight="700">1 · Pick point</text>
    <text x="50" y="224" fill="#2c3e50">syllabus clause</text>

    <rect x="250" y="180" width="180" height="60" rx="10" fill="#e8f4fb" stroke="#1a5276" stroke-width="1.5"/>
    <text x="266" y="206" fill="#154360" font-weight="700">2 · Set level/type</text>
    <text x="266" y="224" fill="#2c3e50">cognitive &amp; difficulty</text>

    <rect x="466" y="180" width="180" height="60" rx="10" fill="#e8f4fb" stroke="#1a5276" stroke-width="1.5"/>
    <text x="482" y="206" fill="#154360" font-weight="700">3 · Design stem</text>
    <text x="482" y="224" fill="#2c3e50">clinical scenario</text>
  </g>
  <g stroke="#1a5276" stroke-width="2" fill="none" marker-end="url(#arr5)">
    <path d="M214 210 L246 210"/>
    <path d="M430 210 L462 210"/>
  </g>

  <g font-size="12">
    <rect x="34" y="262" width="285" height="60" rx="10" fill="#e8f4fb" stroke="#1a5276" stroke-width="1.5"/>
    <text x="50" y="288" fill="#154360" font-weight="700">4 · Correct + 3–4 distractors</text>
    <text x="50" y="306" fill="#2c3e50">distractors = real clinical myths</text>

    <rect x="361" y="262" width="285" height="60" rx="10" fill="#e8f4fb" stroke="#1a5276" stroke-width="1.5"/>
    <text x="377" y="288" fill="#154360" font-weight="700">5 · Write analysis &amp; trace</text>
    <text x="377" y="306" fill="#2c3e50">point mapping + source</text>
  </g>
  <g stroke="#1a5276" stroke-width="2" fill="none" marker-end="url(#arr5)">
    <path d="M319 292 L357 292"/>
  </g>

  <!-- distinctive types -->
  <rect x="34" y="344" width="612" height="110" rx="12" fill="#ffffff" stroke="#1a5276" stroke-width="1.3"/>
  <text x="50" y="368" fill="#154360" font-size="13" font-weight="700">Five "Distinctive" Question Types</text>
  <g font-size="11" fill="#2c3e50">
    <text x="50" y="392">• Guideline-update — based on latest clinical guideline changes</text>
    <text x="50" y="412">• Cross-system interference — overlapping symptoms differential</text>
    <text x="50" y="432">• Clinical scenario — common but textbook-absent situations</text>
    <text x="370" y="392">• Progressive case string — A3/A4 dynamic decisions</text>
    <text x="370" y="412">• Cognitive trap — high-frequency misconception packaging</text>
    <text x="370" y="432">aligns with 2025/2026 proposition shifts</text>
  </g>

  <!-- validation +入库 -->
  <rect x="34" y="472" width="612" height="62" rx="12" fill="#0f4c75"/>
  <text x="50" y="498" fill="#ffffff" font-size="12.5" font-weight="700">6 · Validate via Module B → archive into bank (loop back to A)</text>
  <text x="50" y="520" fill="#cfe8fb" font-size="11">AI questions: confidence = 中 · never enter official-conclusion layer · never mimic real exam verbatim</text>
</svg>
