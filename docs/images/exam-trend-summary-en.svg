<svg width="680" height="560"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8590c"/><stop offset="1" stop-color="#e67e22"/>
    </linearGradient>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e67e22"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="560" fill="#f7fafc"/>
  <rect x="0" y="0" width="680" height="60" fill="url(#hdr)"/>
  <text x="34" y="28" fill="#ffffff" font-size="20" font-weight="700">Module C · Exam Trend Summary</text>
  <text x="34" y="48" fill="#fbe9c8" font-size="12.5">From scattered questions to actionable faculty insight</text>

  <!-- two outputs -->
  <rect x="34" y="90" width="300" height="80" rx="12" fill="#fef6e7" stroke="#e67e22" stroke-width="1.5"/>
  <text x="50" y="118" fill="#a8590c" font-size="15" font-weight="700">Output 1 · Exam Report</text>
  <text x="50" y="142" fill="#2c3e50" font-size="11.5">single exam / system / subject deep-dive</text>

  <rect x="346" y="90" width="300" height="80" rx="12" fill="#fef6e7" stroke="#e67e22" stroke-width="1.5"/>
  <text x="362" y="118" fill="#a8590c" font-size="15" font-weight="700">Output 2 · Annual Review</text>
  <text x="362" y="142" fill="#2c3e50" font-size="11.5">cross-year comparison, next-year focus</text>

  <!-- 7 metrics -->
  <text x="34" y="208" fill="#a8590c" font-size="14" font-weight="700">Core Metrics (computed from Module B aggregation)</text>
  <g font-size="11.5" fill="#2c3e50">
    <rect x="34" y="220" width="150" height="38" rx="8" fill="#ffffff" stroke="#e67e22"/>
    <text x="44" y="244">1 · Score distribution</text>
    <rect x="194" y="220" width="150" height="38" rx="8" fill="#ffffff" stroke="#e67e22"/>
    <text x="204" y="244">2 · Question types</text>
    <rect x="354" y="220" width="150" height="38" rx="8" fill="#ffffff" stroke="#e67e22"/>
    <text x="364" y="244">3 · Cognitive levels</text>
    <rect x="514" y="220" width="132" height="38" rx="8" fill="#ffffff" stroke="#e67e22"/>
    <text x="524" y="244">4 · Difficulty</text>

    <rect x="34" y="266" width="150" height="38" rx="8" fill="#ffffff" stroke="#e67e22"/>
    <text x="44" y="290">5 · High-freq points</text>
    <rect x="194" y="266" width="150" height="38" rx="8" fill="#ffffff" stroke="#e67e22"/>
    <text x="204" y="290">6 · New / changed</text>
    <rect x="354" y="266" width="150" height="38" rx="8" fill="#ffffff" stroke="#e67e22"/>
    <text x="364" y="290">7 · Proposition patterns</text>
    <rect x="514" y="266" width="132" height="38" rx="8" fill="#ffffff" stroke="#e67e22"/>
    <text x="524" y="290">heatmap</text>
  </g>

  <!-- annual review method -->
  <rect x="34" y="328" width="612" height="120" rx="12" fill="#ffffff" stroke="#e67e22" stroke-width="1.3"/>
  <text x="50" y="354" fill="#a8590c" font-size="14" font-weight="700">Annual Review Method</text>
  <g font-size="11.5" fill="#2c3e50">
    <text x="50" y="380">• Take 3–5 years, compute year-over-year: which systems rose / fell</text>
    <text x="50" y="400">• Detect pattern drift: A3 up, A2 down, application-layer up</text>
    <text x="50" y="420">• Extract teaching advice: modules to strengthen next cycle</text>
    <text x="50" y="440">• Produce "dynamic point-update checklist" for collective lesson planning</text>
  </g>

  <!-- discipline -->
  <rect x="34" y="466" width="612" height="66" rx="12" fill="#0f4c75"/>
  <text x="50" y="494" fill="#ffffff" font-size="13" font-weight="700">Output discipline</text>
  <text x="50" y="516" fill="#cfe8fb" font-size="11.5">All ratios cite source &amp; year · estimates marked 【待核实】 · trend needs ≥2 years · end with executable faculty actions</text>
</svg>
